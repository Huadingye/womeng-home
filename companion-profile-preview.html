<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7775b8">
  <title id="pageTitle">晚风 · 陪玩主页</title>
  <style>
    @font-face{font-family:WenKai;src:url('assets/wenkai-ui.woff2') format('woff2');font-display:swap}
    @font-face{font-family:KuaiLe;src:url('assets/kuaile-heading.woff2') format('woff2');font-display:swap}
    :root{color-scheme:light;--ink:#343258;--muted:#73729c;--paper:#fffaff;--lav:#8f83d3;--lilac:#ded7ff;--pink:#f0bddc;--line:#fffaffcc;--font-ui:WenKai,'PingFang SC','Microsoft YaHei',sans-serif;--font-title:KuaiLe,WenKai,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);font-family:var(--font-ui);color:var(--ink);background:#7775b8;font-synthesis:none}
    *{box-sizing:border-box}
    html{min-width:320px;min-height:100%;scroll-behavior:smooth;scrollbar-color:#b6adeb transparent}
    body{min-width:320px;min-height:100svh;margin:0;overflow-x:hidden;background:#7775b8;font-size:15px}
    body::before{content:"";position:fixed;z-index:0;inset:0;pointer-events:none;background:linear-gradient(#67639d66,#a89dd666),url('assets/theme-background.webp') center top/cover no-repeat;filter:saturate(1.1);opacity:.86}
    button,a{-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px}
    ::selection{background:#f5d7ef;color:#312d5c}
    .icon-library{position:absolute;width:0;height:0;overflow:hidden}
    svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .app{position:relative;z-index:1;width:100%;max-width:460px;min-height:100svh;margin:0 auto;padding-bottom:calc(112px + env(safe-area-inset-bottom));color:var(--paper)}
    .topbar{position:absolute;z-index:10;top:0;left:0;width:100%;height:74px;display:flex;align-items:center;justify-content:space-between;padding:10px 19px;color:#fff}
    .topbar-left,.topbar-right{display:flex;align-items:center;gap:10px}
    .topbar-button{width:44px;height:44px;display:grid;place-items:center;border:1px solid #fff5;border-radius:50%;background:#3c396555;color:#fff;backdrop-filter:blur(10px)}
    .topbar-button svg{width:23px;height:23px;stroke-width:2.2}
    .topbar-title{display:none}
    main{padding:0 18px 20px}
    .hero-stage{position:relative;margin:0 -18px;padding:17px 19px 0;min-height:330px;background:linear-gradient(180deg,#28264f55 0%,transparent 40%,#5f5b9cbb 100%);overflow:hidden}
    .hero-stage::after{content:"";position:absolute;z-index:0;inset:auto -15% -100px;height:220px;background:radial-gradient(ellipse,#efeaff88 0%,transparent 69%);pointer-events:none}
    .holo-card{position:relative;z-index:1;height:238px;margin:0 8px;border:1px solid #fff9;border-radius:20px 24px 25px 18px;overflow:hidden;transform:rotate(-2deg);background:#8379bd;box-shadow:0 18px 36px #24204655;isolation:isolate}
    .holo-card::before{content:"";position:absolute;z-index:2;inset:0;background:linear-gradient(112deg,transparent 14%,#fff6 31%,transparent 44%,#c9d9ff2e 66%,transparent 77%),radial-gradient(circle at 74% 13%,#fff9 0 1px,transparent 2px),radial-gradient(circle at 26% 75%,#fff8 0 1px,transparent 2px);background-size:auto,55px 55px,73px 73px;mix-blend-mode:screen;pointer-events:none}
    .holo-card::after{content:"";position:absolute;z-index:3;inset:8px;border:1px solid #fff8;border-radius:15px;transform:rotate(1deg);pointer-events:none}
    .holo-card.is-floating{transform:rotateY(-10deg) rotateX(4deg) rotate(-1deg) translateY(-8px) scale(1.025);box-shadow:0 26px 42px #24204677;transition:transform .42s var(--ease),box-shadow .42s var(--ease)}
    .holo-card img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 30%;filter:saturate(1.12) brightness(1.06)}
    .card-stamp{position:absolute;z-index:4;left:20px;top:18px;color:#fff;font-family:var(--font-title);font-size:16px;text-shadow:0 1px 8px #51418888;transform:rotate(-2deg)}
    .card-stamp small{display:block;font-family:var(--font-ui);font-size:9px;letter-spacing:2px;opacity:.84;margin-top:1px}
    .card-spark{position:absolute;z-index:4;right:22px;bottom:25px;color:#fff;font-size:30px;line-height:1;text-shadow:0 0 14px #fff}
    .save-float{position:absolute;z-index:6;right:9px;top:217px;display:flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 11px;border:1px solid #fff8;border-radius:23px;background:#534f8dbd;color:#fff;box-shadow:0 6px 14px #302b5d42;backdrop-filter:blur(10px);font-size:14px}
    .save-float svg{width:19px;height:19px}
    .save-float[aria-pressed="true"]{background:#c16eaaee}
    .identity-block{position:relative;z-index:4;min-height:108px;padding:15px 5px 11px 106px;margin-top:-3px}
    .portrait-frame{position:absolute;left:1px;top:-19px;width:91px;height:91px;padding:4px;border:2px solid #fff;border-radius:50%;background:#b7aef0;box-shadow:0 7px 20px #35305d66,0 0 0 5px #ffffff22}
    .portrait-frame img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%}
    .person-name-line{display:flex;align-items:center;gap:8px;min-width:0}
    .person-name-line h1{margin:0;font-family:var(--font-title);font-size:30px;font-weight:400;line-height:1.1;color:#fff;text-shadow:0 2px 9px #37325d66;white-space:nowrap}
    .gender-badge{width:21px;height:21px;display:grid;place-items:center;border-radius:50%;background:#f3a7d3;color:#fff}
    .gender-badge[data-gender="male"]{background:#8eb8ef}
    .gender-badge svg{width:14px;height:14px;stroke-width:2.2}
    .profile-line{margin:8px 0 9px;color:#f5f2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;text-shadow:0 1px 6px #423d6a66}
    .status-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:16px;background:#61c795e8;color:#fff;font-size:12px;box-shadow:0 4px 12px #314a4a30}
    .status-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:#ceffbd}
    .section{position:relative;margin-top:14px;padding:14px 13px 13px;border:0;border-radius:22px;background:#807ab655;box-shadow:0 10px 23px #332d6527, inset 0 1px #ffffff22;backdrop-filter:blur(12px)}
    .voice-panel{display:grid;grid-template-columns:42px minmax(0,1fr) 48px 45px 42px;align-items:center;gap:10px;min-height:76px;padding:11px 12px;border:0;border-radius:22px;background:#716da970;color:#fff;box-shadow:0 8px 19px #332d6527, inset 0 1px #ffffff22}
    .voice-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#f6e9ffcc;color:#806fc7}
    .voice-icon svg{fill:none;stroke:currentColor;width:22px;height:22px}
    .voice-copy{min-width:0;display:flex;flex-direction:column;gap:4px}
    .voice-copy strong{font-size:16px;font-weight:600;white-space:nowrap}
    .voice-copy small{font-size:12px;color:#eeeaff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .waveform{height:26px;display:flex;align-items:center;justify-content:center;gap:3px;overflow:hidden}
    .waveform i{width:2px;height:7px;border-radius:2px;background:#f6e8ff}.waveform i:nth-child(2n){height:13px}.waveform i:nth-child(3n){height:20px}.waveform i:nth-child(5n){height:16px}
    .voice-time{font-size:12px;color:#f7f0ff;text-align:right}
    .voice-play{width:42px;height:42px;display:grid;place-items:center;border:1px solid #fff9;border-radius:50%;background:#f4e5ff;color:#8a6fc5;box-shadow:0 4px 12px #4b397744}
    .voice-play svg{width:18px;height:18px;fill:currentColor;stroke:none;margin-left:2px}
    .section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 1px 12px;color:#fff}
    .section-heading h2{display:flex;align-items:center;gap:8px;margin:0;font-family:var(--font-title);font-size:21px;font-weight:400;line-height:1.2}
    .section-heading h2 svg{width:21px;height:21px;color:#ffdbfb}
    .section-heading small{font-size:12px;color:#eeeaff}
    .text-action{display:inline-flex;align-items:center;gap:3px;border:0;background:transparent;color:#fff;font-size:12px;padding:5px 0}
    .text-action svg{width:15px;height:15px}
    .gift-toggle{width:32px;height:26px;display:grid;place-items:center;margin:8px auto -3px;border:0;border-radius:14px;background:#ffffff8c;color:#6876a2;box-shadow:0 3px 8px #6d73a01c;padding:0;transition:background .2s var(--ease),color .2s var(--ease)}
    .gift-toggle:hover{background:#fff;color:#586594}
    .gift-toggle svg{width:16px;height:16px;transform:rotate(90deg);transition:transform .24s var(--ease)}
    .gift-toggle[aria-expanded="true"] svg{transform:rotate(-90deg)}
    .gift-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:var(--gift-expanded-height,9999px);overflow:hidden;transition:opacity .2s var(--ease),max-height .32s var(--ease)}
    .gift-grid.is-collapsed{max-height:var(--gift-collapsed-height,180px);opacity:1}
    .gift-grid.is-collapsed{-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 calc(100% - 22px),transparent 100%);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%}
    .gift-item{min-width:0;padding:7px 5px 8px;border:1px solid #fff8;border-radius:14px;background:linear-gradient(145deg,#dcd5ffcc,#f3e9ffb8);color:#3d396c;text-align:center;box-shadow:0 5px 12px #4e43792e;cursor:pointer;font:inherit;transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .22s var(--ease)}
    .gift-item:hover,.gift-item:focus-visible{transform:translateY(-2px);background:linear-gradient(145deg,#e9e4ffed,#fff8ffed);box-shadow:0 8px 16px #4e43793a;outline:0}
    .gift-item:focus-visible{box-shadow:0 0 0 3px #b6a8ed66,0 8px 16px #4e43793a}
    .gift-item.is-lit{background:linear-gradient(145deg,#e1efffcc,#fdf1ffea);box-shadow:0 6px 16px #7f7cc044}
    .gift-art{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;margin-bottom:5px;padding:2px;isolation:isolate}
    .gift-art img{position:relative;z-index:2;width:86%;height:86%;object-fit:contain;opacity:.56;filter:grayscale(1) saturate(.15) drop-shadow(0 4px 5px #62549330);transition:opacity .4s var(--ease),filter .55s var(--ease),transform .4s var(--ease)}
    .gift-item.is-lit .gift-art img{opacity:1;filter:saturate(1.04) contrast(1.02) drop-shadow(0 4px 7px #6254934c);transform:scale(1.02)}
    .gift-halo{position:absolute;z-index:0;width:64%;height:64%;border-radius:50%;background:radial-gradient(circle,#b8d4f65c,#e2d5f826 44%,transparent 73%);opacity:0;transform:scale(.82);transition:opacity .8s var(--ease),transform .8s var(--ease)}
    .gift-particle{position:absolute;top:50%;left:50%;z-index:4;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--particle-color,#b9dbef);box-shadow:0 1px 7px #91bee0c2;opacity:0;transform:translate(0,0) scale(.1);transition:opacity .5s ease;pointer-events:none}
    .gift-particle--star{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:0;clip-path:polygon(50% 0,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0 50%,37% 37%);filter:drop-shadow(0 0 4px #fff)}
    .gift-particle--diamond{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:1px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);filter:drop-shadow(0 0 4px #fff)}
    .gift-particle--ring{width:12px;height:12px;margin:-6px 0 0 -6px;border:1px solid var(--particle-color,#b9dbef);border-radius:50%;background:transparent;box-shadow:0 0 6px var(--particle-color,#b9dbef)}
    .gift-particle--spark{width:3px;height:16px;margin:-8px 0 0 -1.5px;border-radius:99px;background:linear-gradient(180deg,transparent,#fff 48%,transparent);box-shadow:0 0 6px var(--particle-color,#b9dbef);transform-origin:50% 50%}
    .gift-particle--spark::after{content:"";position:absolute;top:6.5px;left:-6px;width:15px;height:3px;border-radius:99px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 6px var(--particle-color,#b9dbef)}
    .gift-shimmer{position:absolute;z-index:5;inset:4%;border-radius:inherit;background:linear-gradient(112deg,transparent 18%,#fff9 36%,transparent 47%,#dce9ff4c 58%,transparent 72%);background-size:210% 100%;background-position:-130% 0;mix-blend-mode:screen;opacity:0;pointer-events:none}
    .gift-item.is-lit .gift-halo{opacity:1;transform:scale(1.12);animation:gift-halo-breathe 4.8s ease-in-out infinite}
    .gift-item.is-lit .gift-particle{animation:gift-particle-burst var(--duration,5.8s) cubic-bezier(.2,.72,.3,1) var(--delay,0s) infinite}
    .gift-item.is-lit .gift-shimmer{opacity:.7;animation:gift-shimmer-sweep 5.8s ease-in-out -1.4s infinite}
    .gift-item.is-lit .gift-art img{animation:gift-image-breathe 4.8s ease-in-out infinite}
    .gift-meta{display:inline-flex;align-items:center;justify-content:center;gap:5px;max-width:100%;padding:4px 7px 3px;border-radius:999px;background:#ffffffd9;color:#4d5d8b;box-shadow:0 2px 7px #7c8bb01f;vertical-align:top}
    .gift-meta strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600}
    .gift-meta small{color:#7968aa;font-size:10px;white-space:nowrap;font-weight:600}
    body.dialog-open{overflow:hidden}
    .gift-dialog,.payment-dialog{position:fixed;z-index:50;inset:0;display:grid;place-items:end center;padding:14px;background:#35315866}
    .gift-dialog[hidden],.payment-dialog[hidden]{display:none}
    .gift-dialog-panel,.payment-dialog-panel{position:relative;width:min(100%,460px);max-height:min(88svh,620px);overflow:auto;border:1px solid #fff;border-radius:25px 25px 18px 18px;background:#fffafff7;color:#454875;box-shadow:0 -12px 34px #312b5c35;padding:21px 18px calc(18px + env(safe-area-inset-bottom));animation:dialog-rise .28s var(--ease)}
    .dialog-close{position:absolute;top:12px;right:12px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:#eef0ff;color:#6874a0}
    .dialog-close svg{width:17px;height:17px}
    .gift-dialog-head{display:flex;align-items:center;gap:15px;padding:2px 34px 15px 2px}
    .gift-dialog-art{width:100px;height:100px;display:grid;place-items:center;flex:none;border-radius:20px;background:linear-gradient(145deg,#e4e2ff,#fff0fa);box-shadow:inset 0 1px #fff,0 7px 16px #7e78aa20}
    .gift-dialog-art img{width:92%;height:92%;object-fit:contain;filter:drop-shadow(0 5px 7px #62549344)}
    .dialog-kicker{margin:0 0 4px;color:#8c86b5;font-size:11px}
    .gift-dialog-head h2,.payment-dialog-panel h2{margin:0;color:#4d568e;font-family:var(--font-title);font-size:25px;font-weight:400}
    .dialog-price{margin:7px 0 0;color:#9a6a9b;font-size:17px;font-weight:700}
    .recipient-strip{display:flex;align-items:center;gap:9px;margin:2px 0 15px;padding:9px 11px;border-radius:13px;background:#f3f1ff;color:#74759e;font-size:12px}
    .recipient-strip img{width:28px;height:28px;display:block;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 6px #6863982b}
    .recipient-strip strong{color:#51598d;font-size:13px}
    .quantity-row,.gift-total-row{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#626992;font-size:13px}
    .quantity-stepper{display:flex;align-items:center;gap:12px}
    .stepper-button{width:32px;height:32px;display:grid;place-items:center;border:1px solid #d4d5ee;border-radius:10px;background:#fff;color:#6570a4}
    .stepper-button:hover{background:#eff0ff}
    .stepper-button svg{width:15px;height:15px}
    .quantity-output{min-width:20px;color:#4d568e;font-size:16px;font-weight:700;text-align:center}
    .gift-total-row{margin:16px 0 14px;padding-top:13px;border-top:1px solid #ece9f6}
    .gift-total-row strong{color:#8d568e;font-size:18px}
    .gift-submit,.payment-close{width:100%;height:48px;border:0;border-radius:14px;background:linear-gradient(105deg,#f0bddc,#c8b4ef);color:#fff;font-family:var(--font-title);font-size:19px;box-shadow:0 7px 15px #b88cba36}
    .payment-dialog{place-items:center;padding:18px}
    .payment-dialog-panel{width:min(100%,370px);padding:26px 22px 22px;text-align:center;border-radius:24px}
    .payment-dialog-panel h2{font-size:24px}
    .payment-subtitle{margin:6px 0 15px;color:#777aa0;font-size:12px}
    .payment-order-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:9px 11px;border-radius:12px;background:#f4f2ff;color:#626991;font-size:12px}
    .payment-order-line strong{color:#8d568e;font-size:16px}
    .qr-code{width:214px;height:214px;display:grid;grid-template-columns:repeat(25,1fr);grid-template-rows:repeat(25,1fr);gap:0;margin:0 auto 12px;padding:8px;border:8px solid #fff;border-radius:12px;background:#fff;box-shadow:0 6px 15px #6a67972b}
    .qr-code i{display:block;background:transparent}
    .qr-code i.is-dark{background:#31345f}
    .payment-close{height:42px;background:#eef0ff;color:#646e9d;box-shadow:none;font-family:var(--font-ui);font-size:14px}
    .order-dialog{position:fixed;z-index:51;inset:0;display:grid;place-items:end center;padding:14px;background:#35315866}
    .order-dialog[hidden]{display:none}
    .order-dialog-panel{position:relative;width:min(100%,460px);max-height:min(90svh,680px);overflow:auto;border:1px solid #fff;border-radius:25px 25px 18px 18px;background:#fffafff7;color:#454875;box-shadow:0 -12px 34px #312b5c35;padding:21px 18px calc(18px + env(safe-area-inset-bottom));animation:dialog-rise .28s var(--ease)}
    .order-dialog-head{display:flex;align-items:start;justify-content:space-between;gap:14px;padding:1px 34px 17px 2px}
    .order-dialog-head h2{margin:0;color:#4d568e;font-family:var(--font-title);font-size:25px;font-weight:400}
    .order-dialog-kicker{margin:0 0 4px;color:#8c86b5;font-size:11px}
    .order-online{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:5px 8px;border-radius:999px;background:#e7f3ec;color:#47745a;font-size:11px;white-space:nowrap}
    .order-online::before{content:"";width:6px;height:6px;border-radius:50%;background:#72d49a}
    .order-form{display:grid;gap:13px}
    .order-field,.order-mode-field{display:grid;gap:7px;margin:0;padding:0;border:0}
    .order-field>span:first-child,.order-mode-field legend{padding:0;color:#656d96;font-size:12px;font-weight:600}
    .order-select-wrap{position:relative;z-index:1;display:block;min-width:0}
    .order-select-wrap.is-open{z-index:20}
    .order-select-trigger{position:relative;width:100%;min-width:0;height:46px;display:flex;align-items:center;padding:0 34px 0 12px;border:1px solid #cfd9ee;border-radius:9px;background:rgba(255,253,248,.96);color:#495783;font:inherit;font-size:14px;text-align:left;transition:border-color .16s,background .16s}
    .order-service-trigger{padding-left:42px}
    .order-select-mark{position:absolute;z-index:1;top:50%;left:11px;width:24px;height:24px;display:grid;place-items:center;transform:translateY(-50%);color:#7888bc;pointer-events:none}
    .order-select-mark svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .order-select-trigger[aria-expanded=true]{border-color:#8296d0;background:#fff}
    .order-select-value{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .order-select-chevron{position:absolute;top:50%;right:11px;width:15px;height:15px;transform:translateY(-50%) rotate(90deg);fill:none;stroke:#7180ad;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .16s;pointer-events:none}
    .order-select-trigger[aria-expanded=true] .order-select-chevron{transform:translateY(-50%) rotate(-90deg)}
    .order-options{position:absolute;z-index:24;top:calc(100% + 8px);left:0;right:0;display:grid;gap:4px;max-height:min(36svh,236px);padding:6px;overflow:auto;border:1px solid #cbd5e9;border-radius:14px;background:#fffdf8;box-shadow:0 12px 26px #586c9b2b;overscroll-behavior:contain}
    .order-options[hidden]{display:none}
    .order-select-wrap.opens-up .order-options{top:auto;bottom:calc(100% + 10px)}
    .order-option{-webkit-appearance:none;appearance:none;width:100%;min-width:0;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 9px;border:0;border-radius:10px;background:transparent;box-shadow:none;color:#495783;font:inherit;font-size:14px;line-height:1.4;text-align:left;white-space:normal;cursor:pointer}

  function renderGifts(){const litState=readGiftLitState();const grid=document.querySelector('#giftGrid');grid.innerHTML=giftCatalog.map(gift=>{const lit=Boolean(litState[gift.name]||previewLitIds.has(gift.id));return `<button class="gift-item${lit?' is-lit':''}" type="button" data-gift-id="${gift.id}" aria-label="${gift.name}，${lit?'已点亮':'未点亮'}，点击查看详情"><span class="gift-art">${giftEffectMarkup()}<img src="${gift.art}" alt="${gift.name}"></span><span class="gift-meta"><strong>${gift.name}</strong><small>¥${gift.price.toFixed(1)}</small></span></button>`}).join('');requestAnimationFrame(()=>{const items=[...grid.querySelectorAll('.gift-item')];const firstRowTop=items[0]?.offsetTop||0;const secondRow=items.find(item=>item.offsetTop>firstRowTop);const secondRowTop=secondRow?.offsetTop||grid.scrollHeight;const peekHeight=secondRow?secondRowTop+Math.max(34,Math.round(secondRow.offsetHeight*.32)):grid.scrollHeight;grid.style.setProperty('--gift-collapsed-height',`${peekHeight}px`);grid.style.setProperty('--gift-expanded-height',`${grid.scrollHeight}px`)})}

  let currentGift=null;let giftQuantity=1;

  function openGiftDialog(id){currentGift=giftCatalog.find(gift=>gift.id===id)||giftCatalog[0];giftQuantity=1;document.querySelector('#giftDialogImage').src=currentGift.art;document.querySelector('#giftDialogImage').alt=currentGift.name;document.querySelector('#giftDialogName').textContent=currentGift.name;document.querySelector('#giftDialogPrice').textContent=`¥${currentGift.price.toFixed(1)} / 个`;document.querySelector('#giftRecipientAvatar').src=profile.image;document.querySelector('#giftRecipientAvatar').alt=`${profile.name}头像`;document.querySelector('#giftRecipientName').textContent=profile.name;updateGiftDialog();giftDialog.hidden=false;paymentDialog.hidden=true;document.body.classList.add('dialog-open')}

  function qrCellIsDark(x,y,size,seed){const finders=[[0,0],[size-7,0],[0,size-7]];for(const [ox,oy] of finders){if(x>=ox&&x<ox+7&&y>=oy&&y<oy+7){const edge=x===ox||x===ox+6||y===oy||y===oy+6;const core=x>=ox+2&&x<=ox+4&&y>=oy+2&&y<=oy+4;return edge||core}}let hash=seed.charCodeAt((x*size+y)%seed.length)||17;hash=(hash*31+x*17+y*13)%997;return hash%2===0}
  function renderQrCode(seed){const size=25;const qr=document.querySelector('#paymentQr');let cells='';for(let y=0;y<size;y+=1){for(let x=0;x<size;x+=1){cells+=`<i class="${qrCellIsDark(x,y,size,seed)?'is-dark':''}"></i>`}}qr.innerHTML=cells}

  const orderDialog=document.querySelector('#orderDialog');const orderService=document.querySelector('#orderService');const orderSku=document.querySelector('#orderSku');const orderScheduleWrap=document.querySelector('#orderScheduleWrap');const orderSchedule=document.querySelector('#orderSchedule');
  function availableServices(){const services=Array.isArray(profile.services)?profile.services:profile.games;const names=services?.map(service=>typeof service==='string'?service:service?.name).filter(Boolean);return names?.length?names:['王者荣耀']}
  function orderValue(trigger){return trigger.dataset.value||''}

  function renderOrderOptions(trigger,options,value){const selected=options.find(option=>option.value===value)||options[0];const panel=document.querySelector(`#${trigger.id}Options`);trigger.dataset.value=selected?.value||'';trigger.dataset.label=selected?.label||'';trigger.dataset.display=orderOptionText(selected);trigger.dataset.price=selected?.price??'';trigger.querySelector('.order-select-value').textContent=orderOptionText(selected);panel.innerHTML=options.map((option,index)=>`<button type="button" class="order-option" id="${trigger.id}-option-${index}" role="option" aria-selected="${option.value===selected?.value}" data-order-option="${trigger.id}" data-value="${option.value}" data-label="${option.label}" data-display="${orderOptionText(option)}" data-price="${option.price??''}" tabindex="-1"><span class="order-option-copy"><span>${orderOptionText(option)}</span></span><span class="order-option-check">${iconMarkup('check')}</span></button>`).join('')}
  function closeOrderSelect(restoreFocus=false){document.querySelectorAll('[data-order-select-wrap].is-open').forEach(wrap=>{const trigger=wrap.querySelector('[data-order-trigger]');trigger?.setAttribute('aria-expanded','false');trigger?.removeAttribute('aria-activedescendant');const panel=wrap.querySelector('.order-options');if(panel)panel.hidden=true;wrap.classList.remove('is-open','opens-up');if(restoreFocus)trigger?.focus({preventScroll:true})})}

  const holoCard=document.querySelector('#holoCard');let tiltDrag=null;let suppressDoubleClickUntil=0;const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));const setTilt=(x,y)=>{holoCard.style.setProperty('--card-tilt-x',`${x}deg`);holoCard.style.setProperty('--card-tilt-y',`${y}deg`)};
  holoCard.addEventListener('pointerdown',event=>{if(event.pointerType==='mouse'&&event.button!==0)return;tiltDrag={id:event.pointerId,x:event.clientX,y:event.clientY,moved:false};holoCard.setPointerCapture(event.pointerId);holoCard.classList.add('is-tilting');event.preventDefault()});

  holoCard.addEventListener('pointerup',finishTilt);holoCard.addEventListener('pointercancel',finishTilt);
  holoCard.addEventListener('dblclick',event=>{if(performance.now()<suppressDoubleClickUntil){event.preventDefault();return}event.currentTarget.classList.toggle('is-floating')});
  document.querySelector('#giftGrid').addEventListener('click',event=>{const item=event.target.closest('.gift-item');if(item)openGiftDialog(item.dataset.giftId)});
  document.querySelector('#giftMinus').addEventListener('click',()=>{giftQuantity=Math.max(1,giftQuantity-1);updateGiftDialog()});document.querySelector('#giftPlus').addEventListener('click',()=>{giftQuantity=Math.min(99,giftQuantity+1);updateGiftDialog()});document.querySelector('#giftSubmit').addEventListener('click',openPaymentDialog);document.querySelector('#giftDialogClose').addEventListener('click',closeGiftDialog);document.querySelector('#paymentDialogClose').addEventListener('click',closePaymentDialog);document.querySelector('#paymentDialogDone').addEventListener('click',closePaymentDialog);giftDialog.addEventListener('click',event=>{if(event.target===giftDialog)closeGiftDialog()});paymentDialog.addEventListener('click',event=>{if(event.target===paymentDialog)closePaymentDialog()});document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.querySelector('[data-order-select-wrap].is-open')){closeOrderSelect(true);return}if(!paymentDialog.hidden)closePaymentDialog();else if(!giftDialog.hidden)closeGiftDialog();else if(!orderDialog.hidden)closeOrderDialog()}});
  document.addEventListener('keydown',event=>{const trigger=event.target.closest('[data-order-trigger]');if(!trigger)return;const wrap=trigger.closest('[data-order-select-wrap]');const options=[...wrap.querySelectorAll('.order-option')];const activeIndex=options.findIndex(option=>option.id===trigger.getAttribute('aria-activedescendant'));if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();if(trigger.getAttribute('aria-expanded')!=='true')openOrderSelect(trigger);else{const delta=event.key==='ArrowDown'?1:-1;setOrderActiveOption(trigger,options[(Math.max(activeIndex,0)+delta+options.length)%options.length])}}else if(trigger.getAttribute('aria-expanded')==='true'&&(event.key==='Home'||event.key==='End')){event.preventDefault();setOrderActiveOption(trigger,event.key==='Home'?options[0]:options[options.length-1])}else if(trigger.getAttribute('aria-expanded')==='true'&&event.key==='Enter'){event.preventDefault();if(options[activeIndex])chooseOrderOption(options[activeIndex])}});
  document.querySelectorAll('input[name="orderMode"]').forEach(input=>{input.addEventListener('change',()=>{const scheduled=input.checked&&input.value==='scheduled';orderScheduleWrap.hidden=!scheduled;orderSchedule.required=scheduled;if(scheduled)setOrderScheduleMin()})});document.querySelector('#orderDialogClose').addEventListener('click',closeOrderDialog);orderDialog.addEventListener('click',event=>{if(event.target===orderDialog){closeOrderDialog();return}const trigger=event.target.closest('[data-order-trigger]');if(trigger&&orderDialog.contains(trigger)){if(trigger.getAttribute('aria-expanded')==='true')closeOrderSelect();else openOrderSelect(trigger);return}const option=event.target.closest('[data-order-option]');if(option&&orderDialog.contains(option)){chooseOrderOption(option);return}if(!event.target.closest('[data-order-select-wrap]'))closeOrderSelect()});document.querySelector('#orderForm').addEventListener('submit',event=>{event.preventDefault();const scheduled=document.querySelector('input[name="orderMode"]:checked').value==='scheduled';if(scheduled&&!orderSchedule.value){showToast('请选择预约时间');return}showToast(`已选择${orderValue(orderService)} · ${orderValue(orderSku)}`);closeOrderDialog()});
  document.querySelector('#voiceButton').addEventListener('click',()=>showToast('语音尚未上传'));document.querySelector('#orderButton').addEventListener('click',openOrderDialog);document.querySelector('#giftToggle').addEventListener('click',event=>{const button=event.currentTarget;const expanded=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!expanded));button.setAttribute('aria-label',expanded?'展开礼物橱窗':'收起礼物橱窗');document.querySelector('#giftGrid').classList.toggle('is-collapsed',expanded)});document.querySelector('#momentGrid').addEventListener('click',event=>{const item=event.target.closest('.moment-item');if(item)showToast(`${item.dataset.game} · 游戏时刻`)});
</script>
